name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_BUILDKIT: "1"

jobs:
  quick-gate:
    name: quick gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Print runner diagnostics
        run: |
          nproc
          free -h
          df -h
          docker version
          docker compose version
          pwsh -NoLogo -Command "\$PSVersionTable.PSVersion.ToString()"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/rag-api/requirements.txt
            services/sales-agent/requirements.txt
            services/ghl-sync/requirements.txt
            mock/ghl-mock-server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -r services/rag-api/requirements.txt

      - name: Lint Python syntax-critical rules
        run: python -m ruff check services/rag-api services/sales-agent services/ghl-sync mock/ghl-mock-server

      - name: Run RAG mock-mode tests
        env:
          PYTHONPATH: services/rag-api
        run: python -m pytest services/rag-api/tests

      - name: Run static release checks
        shell: pwsh
        run: |
          ./scripts/verify-standalone-release.ps1
          ./scripts/verify-phase2-static.ps1
          ./scripts/verify-phase3-static.ps1

      - name: Validate Compose configuration
        run: docker compose --env-file deploy/.env.mock -f deploy/docker-compose.yml config --quiet

      - name: Validate queue-mode Compose configuration
        shell: pwsh
        run: ./scripts/verify-queue-config.ps1

      - name: Validate Kubernetes manifests
        shell: pwsh
        run: ./scripts/verify-k8s-manifests.ps1 -SkipClientDryRun

  docker-smoke:
    name: docker smoke
    runs-on: ubuntu-latest
    needs: quick-gate
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Print runner diagnostics
        run: |
          nproc
          free -h
          df -h
          docker version
          docker compose version
          pwsh -NoLogo -Command "\$PSVersionTable.PSVersion.ToString()"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run mock-first Compose smoke
        shell: pwsh
        run: ./scripts/ci-smoke.ps1 -ProjectName revenueops-ci
