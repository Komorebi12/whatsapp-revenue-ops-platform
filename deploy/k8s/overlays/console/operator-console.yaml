apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-console
  labels:
    app.kubernetes.io/name: operator-console
    app.kubernetes.io/part-of: whatsapp-revenue-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operator-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-console
        app.kubernetes.io/part-of: whatsapp-revenue-ops
    spec:
      containers:
        - name: operator-console
          image: operator-console:local-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MVP_REPLY_WEBHOOK_URL
              value: http://n8n-webhook:5678/webhook/console/reply
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: revenue-ops-secret
                  key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
                  optional: true
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: revenue-ops-secret
                  key: CLERK_SECRET_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: revenue-ops-app-config
            - secretRef:
                name: revenue-ops-secret
          startupProbe:
            httpGet:
              path: /sign-in
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /sign-in
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /sign-in
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: operator-console
spec:
  selector:
    app.kubernetes.io/name: operator-console
  ports:
    - name: http
      port: 3000
      targetPort: http

