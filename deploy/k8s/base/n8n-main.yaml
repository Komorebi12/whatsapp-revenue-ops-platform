apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: main
    app.kubernetes.io/part-of: whatsapp-revenue-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: main
        app.kubernetes.io/part-of: whatsapp-revenue-ops
    spec:
      initContainers:
        - name: wait-for-postgres
          image: n8nio/n8n:2.17.6
          command:
            - /bin/sh
            - -c
            - |
              until node -e "const net=require('net'); const s=net.createConnection({host:'postgres',port:5432},()=>{s.end();process.exit(0)}); s.on('error',()=>process.exit(1)); s.setTimeout(1000,()=>{s.destroy();process.exit(1)});"; do
                echo "waiting for postgres"
                sleep 2
              done
      containers:
        - name: n8n
          image: n8nio/n8n:2.17.6
          command: ["/bin/sh", "/bootstrap/n8n-entrypoint.sh"]
          ports:
            - name: http
              containerPort: 5678
          envFrom:
            - configMapRef:
                name: revenue-ops-app-config
            - secretRef:
                name: revenue-ops-secret
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: n8n-bootstrap
              mountPath: /bootstrap/n8n-entrypoint.sh
              subPath: n8n-entrypoint.sh
              readOnly: true
            - name: n8n-workflows
              mountPath: /workflows
              readOnly: true
            - name: n8n-credentials
              mountPath: /credentials
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: n8n-bootstrap
          configMap:
            name: n8n-bootstrap
            defaultMode: 0555
        - name: n8n-workflows
          configMap:
            name: n8n-workflows
        - name: n8n-credentials
          secret:
            secretName: n8n-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: main
  ports:
    - name: http
      port: 5678
      targetPort: http

