apiVersion: v1
kind: ConfigMap
metadata:
  name: revenue-ops-app-config
data:
  MOCK_MODE: "true"
  LOG_LEVEL: "INFO"

  COMPANY_NAME: "Demo Corp"
  COMPANY_PRODUCT_SUMMARY: "CRM and automation solutions for SMBs"

  GEMINI_BASE_URL: "http://ghl-mock:8090/mock-gemini"
  GEMINI_MODEL: "mock-gemini"

  GHL_SYNC_BASE_URL: "http://ghl-sync:8010"
  GHL_LOCATION_ID: "loc_mock_001"
  GHL_PIPELINE_ID: "pipe_mock_001"
  GHL_STAGE_LEAD_CAPTURE_ID: "stage_mock_lead_capture"
  GHL_STAGE_QUALIFICATION_ID: "stage_mock_qualification"
  GHL_STAGE_WON_ID: "stage_mock_won"
  GHL_STAGE_LOST_ID: "stage_mock_lost"
  GHL_INTENT_FIELD_KEY: "whatsapp_intent"
  GHL_API_BASE_URL: "http://ghl-mock:8090"
  GHL_API_VERSION: "2021-07-28"
  SYNC_SOURCE_SYSTEM: "whatsapp_demo"

  QDRANT_URL: "http://qdrant:6333"
  QDRANT_API_KEY: "local-dev-dummy-key"
  QDRANT_COLLECTION: "whatsapp_demo_knowledge"
  EMBEDDING_MODEL: "gemini-embedding-001"
  EMBEDDING_DIMENSION: "3072"
  LLM_MODEL: "gemini-2.5-flash"
  CHUNK_SIZE: "500"
  CHUNK_OVERLAP: "100"
  EMBEDDING_BATCH_SIZE: "20"
  EMBEDDING_BATCH_SLEEP_SECONDS: "4"
  TOP_K: "5"

  N8N_HOST: "0.0.0.0"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  N8N_EDITOR_BASE_URL: "http://localhost:5678"
  N8N_BASIC_AUTH_ACTIVE: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"
  NODE_FUNCTION_ALLOW_EXTERNAL: "*"
  N8N_LOG_LEVEL: "info"
  GENERIC_TIMEZONE: "Asia/Shanghai"
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n_metadata"
  DB_POSTGRESDB_USER: "postgres"
  EXECUTIONS_MODE: "queue"
  QUEUE_BULL_REDIS_HOST: "redis"
  QUEUE_BULL_REDIS_PORT: "6379"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  RAG_API_URL: "http://rag-api:8000/chat"

