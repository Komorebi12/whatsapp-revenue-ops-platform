apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-webhook
  labels:
    app.kubernetes.io/name: n8n-webhook
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: whatsapp-revenue-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-webhook
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-webhook
        app.kubernetes.io/component: webhook
        app.kubernetes.io/part-of: whatsapp-revenue-ops
    spec:
      initContainers:
        - name: wait-for-n8n-main
          image: n8nio/n8n:2.17.6
          command:
            - /bin/sh
            - -c
            - |
              until node -e "require('http').get('http://n8n:5678/healthz',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"; do
                echo "waiting for n8n main"
                sleep 5
              done
      containers:
        - name: n8n-webhook
          image: n8nio/n8n:2.17.6
          args:
            - webhook
          ports:
            - name: http
              containerPort: 5678
          envFrom:
            - configMapRef:
                name: revenue-ops-app-config
            - secretRef:
                name: revenue-ops-secret
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 1024Mi
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-webhook
spec:
  selector:
    app.kubernetes.io/name: n8n-webhook
    app.kubernetes.io/component: webhook
  ports:
    - name: http
      port: 5678
      targetPort: http

