apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghl-mock
  labels:
    app.kubernetes.io/name: ghl-mock
    app.kubernetes.io/part-of: whatsapp-revenue-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ghl-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghl-mock
        app.kubernetes.io/part-of: whatsapp-revenue-ops
    spec:
      containers:
        - name: ghl-mock
          image: ghl-mock:local-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ghl-mock
spec:
  selector:
    app.kubernetes.io/name: ghl-mock
  ports:
    - name: http
      port: 8090
      targetPort: http

